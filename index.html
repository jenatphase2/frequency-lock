<title>Frequency Lock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap">

<style>
/* Single dark-only theme: scientific instrument / phosphor CRT */
:root {
  --bg:         #07090a;
  --panel:      #0c1010;
  --screen:     #030507;
  --g-hi:       #3dff7a;    /* phosphor green – target signal */
  --g-mid:      rgba(61,255,122,0.35);
  --g-lo:       rgba(61,255,122,0.08);
  --a-hi:       #ffb020;    /* amber – tuner signal */
  --a-mid:      rgba(255,176,32,0.3);
  --a-lo:       rgba(255,176,32,0.07);
  --locked-hi:  #ffffff;
  --locked-mid: rgba(255,255,255,0.4);
  --text:       #6b9e7a;
  --text-bright:#b0d4bc;
  --text-dim:   #2f4a38;
  --border:     #15201a;
  --border-mid: #243030;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding-block: 24px;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── Device shell ── */
.device {
  width: 100%;
  max-width: 580px;
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(61,255,122,0.03),
    0 24px 60px rgba(0,0,0,0.75),
    0 2px 8px  rgba(0,0,0,0.5);
}

/* ── Header ── */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
}
.brand {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--text-dim);
  text-transform: uppercase;
}
.pips { display: flex; gap: 8px; align-items: center; }
.pip {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: background .3s, box-shadow .3s;
}
.pip.pwr  { background: var(--g-hi); box-shadow: 0 0 5px var(--g-hi); }
.pip.sig  { background: var(--a-hi); box-shadow: 0 0 5px var(--a-hi); }
.pip.lock { }
.pip.lock.on { background: var(--locked-hi); box-shadow: 0 0 7px var(--locked-hi); }

/* ── Scope screen ── */
.screen-wrap {
  position: relative;
  background: var(--screen);
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
#scope {
  display: block;
  width: 100%;
  height: 190px;
  border-radius: 3px;
  border: 1px solid rgba(61,255,122,0.09);
}
/* Scanlines */
.screen-wrap::after {
  content: '';
  position: absolute;
  inset: 14px 18px;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 2px,
    rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px
  );
  border-radius: 3px;
}
.ch-label {
  position: absolute;
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  top: 22px;
}
.ch-label.ch1 { left: 26px;  color: var(--g-hi); }
.ch-label.ch2 { right: 26px; color: var(--a-hi); }

/* ── Controls row ── */
.controls {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 20px 20px 18px;
}

/* Left: freq readouts */
.readouts { display: flex; flex-direction: column; gap: 14px; }

.readout { display: flex; flex-direction: column; gap: 3px; }
.r-label {
  font-size: 8px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text-dim);
}
.r-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .5px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  transition: color .25s, text-shadow .25s;
}
.r-value.ch1 { color: var(--g-hi); text-shadow: 0 0 10px rgba(61,255,122,.35); }
.r-value.ch2 { color: var(--a-hi); text-shadow: 0 0 10px rgba(255,176,32,.25); }
.r-value.lkd  { color: var(--locked-hi); text-shadow: 0 0 14px rgba(255,255,255,.5); }
.r-unit { font-size: 10px; font-family: 'Share Tech Mono',monospace; opacity: .6; margin-left: 2px; }

.match-wrap { display: flex; flex-direction: column; gap: 4px; }
.match-track {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.match-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--a-hi);
  width: 0%;
  transition: width .06s linear, background .3s, box-shadow .3s;
}
.match-fill.lkd {
  background: var(--g-hi);
  box-shadow: 0 0 6px var(--g-hi);
}

/* Centre: slider */
.slider-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  user-select: none;
  -webkit-user-select: none;
  min-width: 140px;
}
.slider-track {
  position: relative;
  width: 100%;
  height: 6px;
  background: var(--border-mid);
  border-radius: 3px;
  cursor: pointer;
  touch-action: none;
}
.slider-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 3px;
  background: var(--a-hi);
  box-shadow: 0 0 6px var(--a-hi);
  transition: background .3s, box-shadow .3s;
  pointer-events: none;
}
.slider-fill.lkd {
  background: var(--g-hi);
  box-shadow: 0 0 10px var(--g-hi);
}
.slider-thumb {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #3a4a40, #131815);
  border: 2px solid var(--a-hi);
  box-shadow: 0 0 8px rgba(255,176,32,.35), 0 2px 8px rgba(0,0,0,.6);
  cursor: grab;
  transition: border-color .3s, box-shadow .3s;
  pointer-events: none;
}
.slider-thumb.lkd {
  border-color: var(--g-hi);
  box-shadow: 0 0 12px rgba(61,255,122,.5), 0 2px 8px rgba(0,0,0,.6);
}
.slider-track:active .slider-thumb { cursor: grabbing; }
.slider-label {
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* Mute button */
.mute-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border-mid);
  border-radius: 3px;
  padding: 4px 8px;
  cursor: pointer;
  transition: color .2s, border-color .2s;
}
.mute-btn:hover { color: var(--text-bright); border-color: var(--text); }
.mute-btn.muted { color: var(--a-hi); border-color: var(--a-hi); }

/* Success overlay */
.success-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(3,5,7,.88);
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s;
  border-radius: 3px;
  z-index: 10;
}
.success-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.success-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 6px;
  color: var(--g-hi);
  text-shadow: 0 0 24px var(--g-hi), 0 0 60px rgba(61,255,122,.3);
  animation: successPop .4s cubic-bezier(.17,.67,.47,1.4) both;
}
.success-sub {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text);
  text-transform: uppercase;
  animation: successFadeIn .6s .2s both;
}
.success-score {
  font-family: 'Orbitron', sans-serif;
  font-size: 36px;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,.4);
  animation: successPop .5s .1s cubic-bezier(.17,.67,.47,1.4) both;
  font-variant-numeric: tabular-nums;
}
.success-score-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
  animation: successFadeIn .6s .3s both;
}
.success-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #000;
  background: var(--g-hi);
  border: none;
  border-radius: 3px;
  padding: 8px 20px;
  cursor: pointer;
  margin-top: 6px;
  box-shadow: 0 0 20px rgba(61,255,122,.4);
  animation: successFadeIn .5s .4s both;
  transition: transform .1s, box-shadow .2s;
}
.success-btn:hover {
  transform: scale(1.04);
  box-shadow: 0 0 30px rgba(61,255,122,.6);
}
@keyframes successPop {
  from { transform: scale(.6); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}
@keyframes successFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* Particle canvas */
#particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 3px;
}

/* Right: status + controls */
.status-col {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 14px;
}
.lock-badge {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  padding: 6px 10px;
  border: 1px solid var(--border-mid);
  border-radius: 3px;
  color: var(--text-dim);
  min-width: 86px;
  text-align: center;
  transition: all .3s;
}
.lock-badge.lkd {
  color: var(--g-hi);
  border-color: var(--g-hi);
  box-shadow: 0 0 14px rgba(61,255,122,.18);
  animation: glowPulse 1.6s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 10px rgba(61,255,122,.15); }
  50%      { box-shadow: 0 0 22px rgba(61,255,122,.35); }
}

.score-block { text-align: right; }
.score-label { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
.score-num {
  font-family: 'Orbitron', sans-serif;
  font-size: 24px;
  font-weight: 900;
  color: var(--text);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border-mid);
  border-radius: 3px;
  padding: 6px 12px;
  cursor: pointer;
  transition: color .2s, border-color .2s;
}
.btn:hover { color: var(--text-bright); border-color: var(--text); }

/* ── Footer ── */
.ftr {
  padding: 8px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.hint { font-size: 9px; letter-spacing: 1px; color: var(--text-dim); }

/* ── Responsive ── */
@media (max-width: 440px) {
  .controls { grid-template-columns: 1fr 1fr; }
  .slider-col { grid-column: 1 / -1; }
  .r-value { font-size: 17px; }
}

@media (prefers-reduced-motion: reduce) {
  .lock-badge.lkd { animation: none; }
}
</style>

<!-- Device shell -->
<div class="device">

  <div class="hdr">
    <span class="brand">SigLock-7 · Dual Trace Analyzer</span>
    <div class="pips">
      <div class="pip pwr"></div>
      <div class="pip sig"></div>
      <div class="pip lock" id="lockPip"></div>
    </div>
  </div>

  <div class="screen-wrap">
    <span class="ch-label ch1">CH1 · TARGET</span>
    <span class="ch-label ch2">CH2 · TUNER</span>
    <canvas id="scope"></canvas>
    <canvas id="particles"></canvas>
    <div class="success-overlay" id="successOverlay">
      <div class="success-score-label">Locked in</div>
      <div class="success-score" id="successScore">0</div>
      <div class="success-title">LOCKED</div>
      <div class="success-sub">Signal acquired</div>
      <button class="success-btn" id="successNextBtn">Next target ›</button>
    </div>
  </div>

  <div class="controls">

    <div class="readouts">
      <div class="readout">
        <span class="r-label">CH1 Target</span>
        <div class="r-value ch1" id="rTarget">—<span class="r-unit">Hz</span></div>
      </div>
      <div class="readout">
        <span class="r-label">CH2 Tuner</span>
        <div class="r-value ch2" id="rTuner">—<span class="r-unit">Hz</span></div>
      </div>
      <div class="match-wrap">
        <span class="r-label">Match</span>
        <div class="match-track">
          <div class="match-fill" id="matchFill"></div>
        </div>
      </div>
    </div>

    <div class="slider-col">
      <div class="slider-track" id="sliderTrack">
        <div class="slider-fill" id="sliderFill"></div>
        <div class="slider-thumb" id="sliderThumb"></div>
      </div>
      <span class="slider-label">Tune frequency</span>
    </div>

    <div class="status-col">
      <div class="lock-badge" id="lockBadge">SCAN</div>
      <div class="score-block">
        <div class="score-label">Locked</div>
        <div class="score-num" id="scoreNum">0</div>
      </div>
      <button class="mute-btn" id="muteBtn">♪ ON</button>
      <button class="btn" id="nextBtn">NEW ›</button>
    </div>

  </div>

  <div class="ftr">
    <span class="hint">drag slider · ← →</span>
    <span class="hint" id="hintRight">±2 Hz to lock</span>
  </div>
</div>

<script>
// ── Constants ──
const FREQ_MIN  = 100;
const FREQ_MAX  = 900;
const LOCK_HZ   = 2;
const DISPLAY_N = 2.8;
const TARGETS   = [110, 165, 196, 220, 294, 330, 392, 440, 523, 587, 659, 698, 784, 880];

// ── State ──
let targetFreq  = 440;
let tunerFreq   = 220;
let sliderPct   = 0.3;        // 0–1
let isLocked    = false;
let showingSuccess = false;
let score       = 0;
let elapsed     = 0;
let lastTS      = null;
let isDragging  = false;
let isMuted     = false;

// Particles
let particles   = [];

let audioCtx = null, tOsc = null, uOsc = null, masterGain = null;
let tGain = null, uGain = null;
let audioOn = false;

// ── DOM ──
const sliderTrack   = document.getElementById('sliderTrack');
const sliderFill    = document.getElementById('sliderFill');
const sliderThumb   = document.getElementById('sliderThumb');
const rTarget       = document.getElementById('rTarget');
const rTuner        = document.getElementById('rTuner');
const matchFill     = document.getElementById('matchFill');
const lockBadge     = document.getElementById('lockBadge');
const lockPip       = document.getElementById('lockPip');
const scoreNum      = document.getElementById('scoreNum');
const nextBtn       = document.getElementById('nextBtn');
const muteBtn       = document.getElementById('muteBtn');
const hintRight     = document.getElementById('hintRight');
const canvas        = document.getElementById('scope');
const pCanvas       = document.getElementById('particles');
const c             = canvas.getContext('2d');
const pc            = pCanvas.getContext('2d');
const successOverlay = document.getElementById('successOverlay');
const successScore  = document.getElementById('successScore');
const successNextBtn = document.getElementById('successNextBtn');

// ── Freq mapping ──
function pctToFreq(p) {
  return FREQ_MIN * Math.pow(FREQ_MAX / FREQ_MIN, p);
}
function freqToPct(f) {
  return (Math.log(f) - Math.log(FREQ_MIN)) / (Math.log(FREQ_MAX) - Math.log(FREQ_MIN));
}

// ── Set slider position ──
function setSlider(pct) {
  sliderPct = Math.max(0, Math.min(1, pct));
  tunerFreq = pctToFreq(sliderPct);
  sliderFill.style.width  = (sliderPct * 100) + '%';
  sliderThumb.style.left  = (sliderPct * 100) + '%';
  updateReadouts();
  if (audioOn) syncAudio();
}

function sliderPctFromEvent(e) {
  const rect = sliderTrack.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return x / rect.width;
}

// ── Readouts + lock ──
function updateReadouts() {
  const diff  = Math.abs(tunerFreq - targetFreq);
  const match = Math.max(0, 1 - diff / (targetFreq * 0.6));

  rTuner.innerHTML = `${Math.round(tunerFreq)}<span class="r-unit">Hz</span>`;
  matchFill.style.width = (match * 100) + '%';

  const wasLocked = isLocked;
  isLocked = diff <= LOCK_HZ;

  if (isLocked) {
    matchFill.classList.add('lkd');
    lockBadge.textContent = 'LOCKED';
    lockBadge.classList.add('lkd');
    sliderThumb.classList.add('lkd');
    sliderFill.classList.add('lkd');
    lockPip.classList.add('on');
    rTuner.className = 'r-value lkd';
    if (!wasLocked && !showingSuccess) {
      score++;
      scoreNum.textContent = score;
      triggerSuccess();
    }
  } else {
    matchFill.classList.remove('lkd');
    lockBadge.textContent = diff < targetFreq * 0.08 ? 'CLOSE' : 'SCAN';
    lockBadge.classList.remove('lkd');
    sliderThumb.classList.remove('lkd');
    sliderFill.classList.remove('lkd');
    lockPip.classList.remove('on');
    rTuner.className = 'r-value ch2';
  }

  hintRight.textContent = isLocked ? 'signal locked ✓' : `${Math.round(diff)} Hz off`;
}

// ── Success state ──
function triggerSuccess() {
  showingSuccess = true;
  successScore.textContent = score;
  successOverlay.classList.add('show');
  spawnParticles();
}

function dismissSuccess() {
  showingSuccess = false;
  successOverlay.classList.remove('show');
  pickTarget();
}

successNextBtn.addEventListener('click', dismissSuccess);

// ── Particles ──
function spawnParticles() {
  particles = [];
  const W = pCanvas.width, H = pCanvas.height;
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 3.5;
    const hue = Math.random() < 0.6 ? '#3dff7a' : (Math.random() < 0.5 ? '#ffb020' : '#fff');
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.012 + Math.random() * 0.018,
      size: 1.5 + Math.random() * 3,
      color: hue,
    });
  }
}

function updateParticles() {
  pc.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.06;
    p.life -= p.decay;
    pc.save();
    pc.globalAlpha = Math.max(0, p.life);
    pc.fillStyle = p.color;
    pc.shadowColor = p.color;
    pc.shadowBlur = 6;
    pc.beginPath();
    pc.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pc.fill();
    pc.restore();
  }
}

// ── Canvas sizing ──
function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width - 36, h = 190;
  canvas.width  = w; canvas.height  = h;
  pCanvas.width = w; pCanvas.height = h;
}

// ── Oscilloscope ──
function drawScope(ts) {
  requestAnimationFrame(drawScope);
  if (lastTS === null) lastTS = ts;
  elapsed += (ts - lastTS) / 1000;
  lastTS = ts;

  const W = canvas.width, H = canvas.height;
  if (!W || !H) return;

  c.clearRect(0, 0, W, H);
  c.fillStyle = '#030507';
  c.fillRect(0, 0, W, H);

  // Grid
  const cols = 8, rows = 4;
  c.lineWidth = .8;
  c.strokeStyle = 'rgba(61,255,122,0.055)';
  for (let i = 1; i < cols; i++) {
    const x = W * i / cols;
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
  }
  for (let i = 1; i < rows; i++) {
    const y = H * i / rows;
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
  }
  c.strokeStyle = 'rgba(61,255,122,0.11)';
  c.beginPath(); c.moveTo(0, H/2); c.lineTo(W, H/2); c.stroke();
  c.beginPath(); c.moveTo(W/2, 0); c.lineTo(W/2, H); c.stroke();

  const diff   = Math.abs(tunerFreq - targetFreq);
  const matchR = Math.max(0, 1 - diff / (targetFreq * 0.5));

  // CH1 target – stationary
  drawWave(c, W, H, x => Math.sin(2 * Math.PI * DISPLAY_N * x / W), {
    hi: '#3dff7a', glow: 'rgba(61,255,122,0.18)',
    alpha: 0.7 + 0.3 * matchR, width: 1.6, glowWidth: 7,
  });

  // CH2 tuner – drifts
  const beatPhase  = 2 * Math.PI * (tunerFreq - targetFreq) * elapsed;
  const freqRatio  = tunerFreq / targetFreq;
  drawWave(c, W, H, x => Math.sin(2 * Math.PI * DISPLAY_N * freqRatio * x / W + beatPhase), {
    hi: '#ffb020', glow: 'rgba(255,176,32,0.14)',
    alpha: 0.65, width: 1.6, glowWidth: 6,
  });

  // Locked overlay
  if (isLocked) {
    const flicker = 0.75 + 0.25 * Math.sin(elapsed * 7.3);
    drawWave(c, W, H, x => Math.sin(2 * Math.PI * DISPLAY_N * x / W), {
      hi: `rgba(255,255,255,${0.6 * flicker})`, glow: 'rgba(255,255,255,0.12)',
      alpha: 1, width: 2.5, glowWidth: 10,
    });
  }

  updateParticles();
}

function drawWave(ctx, W, H, fn, opts) {
  const amp = H * 0.36, cy = H / 2;
  ctx.save();
  ctx.globalAlpha = opts.alpha;
  ctx.beginPath(); ctx.strokeStyle = opts.glow; ctx.lineWidth = opts.glowWidth; ctx.lineJoin = 'round';
  for (let i = 0; i <= W; i++) { const y = cy - fn(i) * amp; i === 0 ? ctx.moveTo(i,y) : ctx.lineTo(i,y); }
  ctx.stroke();
  ctx.beginPath(); ctx.strokeStyle = opts.hi; ctx.lineWidth = opts.width;
  for (let i = 0; i <= W; i++) { const y = cy - fn(i) * amp; i === 0 ? ctx.moveTo(i,y) : ctx.lineTo(i,y); }
  ctx.stroke();
  ctx.restore();
}

// ── Audio ──
function startAudio() {
  if (audioOn) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.025;   // very quiet master
    masterGain.connect(audioCtx.destination);

    tOsc = audioCtx.createOscillator(); tGain = audioCtx.createGain();
    tOsc.type = 'sine'; tOsc.frequency.value = targetFreq;
    tGain.gain.value = 0.5;
    tOsc.connect(tGain); tGain.connect(masterGain); tOsc.start();

    uOsc = audioCtx.createOscillator(); uGain = audioCtx.createGain();
    uOsc.type = 'sine'; uOsc.frequency.value = tunerFreq;
    uGain.gain.value = 0.8;
    uOsc.connect(uGain); uGain.connect(masterGain); uOsc.start();

    audioOn = true;
    muteBtn.textContent = '♪ ON';
  } catch(e) {}
}

function syncAudio() {
  if (!audioOn) return;
  try {
    tOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.03);
    uOsc.frequency.setTargetAtTime(tunerFreq,  audioCtx.currentTime, 0.03);
  } catch(e) {}
}

muteBtn.addEventListener('click', () => {
  startAudio();
  if (!audioOn) return;
  isMuted = !isMuted;
  masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.025, audioCtx.currentTime, 0.05);
  muteBtn.textContent = isMuted ? '♪ OFF' : '♪ ON';
  muteBtn.classList.toggle('muted', isMuted);
});

// ── Slider interaction ──
sliderTrack.addEventListener('mousedown', e => {
  startAudio();
  isDragging = true;
  setSlider(sliderPctFromEvent(e));
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  setSlider(sliderPctFromEvent(e));
});
document.addEventListener('mouseup', () => { isDragging = false; });

sliderTrack.addEventListener('touchstart', e => {
  startAudio();
  isDragging = true;
  setSlider(sliderPctFromEvent(e));
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (!isDragging) return;
  setSlider(sliderPctFromEvent(e));
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchend', () => { isDragging = false; });

document.addEventListener('keydown', e => {
  const step = e.shiftKey ? 0.03 : 0.006;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
    startAudio(); setSlider(sliderPct + step); e.preventDefault();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
    startAudio(); setSlider(sliderPct - step); e.preventDefault();
  }
});

// ── New target ──
function pickTarget() {
  const pool = TARGETS.filter(f => f !== targetFreq);
  targetFreq = pool[Math.floor(Math.random() * pool.length)];
  rTarget.innerHTML = `${targetFreq}<span class="r-unit">Hz</span>`;
  isLocked = false;
  updateReadouts();
  if (audioOn) syncAudio();
}
nextBtn.addEventListener('click', () => { startAudio(); pickTarget(); });

// ── Init ──
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const initFreq = TARGETS[Math.floor(Math.random() * Math.floor(TARGETS.length / 2))];
setSlider(freqToPct(initFreq));
rTarget.innerHTML = `${targetFreq}<span class="r-unit">Hz</span>`;
updateReadouts();

requestAnimationFrame(drawScope);
</script>
